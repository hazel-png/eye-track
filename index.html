<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand Tracking AR Fixed</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
body { margin: 0; overflow: hidden; background: black; }
#overlay {
    position: fixed;
    inset: 0;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 10;
}
button {
    font-size: 24px;
    padding: 20px 40px;
}
</style>
</head>

<body>

<div id="overlay">
    <button id="start">START</button>
</div>

<video id="video" playsinline style="display:none;"></video>

<script>
let scene, camera, renderer;
let videoTexture;
let handMeshes = [];

init();

function init() {
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 10);
    camera.position.z = 1;

    renderer = new THREE.WebGLRenderer({ alpha: true });
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    // 背景（カメラ映像）
    const video = document.getElementById("video");
    videoTexture = new THREE.VideoTexture(video);
    scene.background = videoTexture;

    // 手のポイント
    const geo = new THREE.SphereGeometry(0.02, 12, 12);
    const mat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });

    for (let i = 0; i < 21; i++) {
        const m = new THREE.Mesh(geo, mat);
        scene.add(m);
        handMeshes.push(m);
    }

    animate();
}

function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}

// =====================
// MediaPipe
// =====================
function startTracking() {
    const video = document.getElementById("video");

    const hands = new Hands({
        locateFile: file =>
            `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
    });

    hands.onResults(results => {
        if (!results.multiHandLandmarks) return;

        const landmarks = results.multiHandLandmarks[0];

        landmarks.forEach((p, i) => {
            const mesh = handMeshes[i];

            // 正しい座標変換（重要）
            mesh.position.x = (p.x - 0.5) * 2;
            mesh.position.y = -(p.y - 0.5) * 2;
            mesh.position.z = -p.z * 0.5;
        });
    });

    const cam = new Camera(video, {
        onFrame: async () => {
            await hands.send({ image: video });
        },
        width: 1280,
        height: 720
    });

    cam.start();
}

// =====================
// UI
// =====================
document.getElementById("start").onclick = async () => {
    document.getElementById("overlay").style.display = "none";

    try {
        await startTracking();
    } catch (e) {
        alert("カメラ起動失敗: " + e);
    }
};

// リサイズ対応
window.addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
