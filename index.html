<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pseudo VR Stable</title>

<style>
body { margin:0; overflow:hidden; background:#000; font-family:sans-serif; }

#overlay {
    position:fixed; inset:0;
    display:flex; justify-content:center; align-items:center;
    background:#000;
    color:white; z-index:10;
}
button {
    font-size:22px;
    padding:15px 40px;
    border:none;
    border-radius:30px;
    background:#4285F4;
    color:white;
}
</style>
</head>
<body>

<div id="overlay">
    <button id="start">START VR</button>
</div>

<video id="video" playsinline style="display:none;"></video>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { DeviceOrientationControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/DeviceOrientationControls.js";
import { Hands } from "https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js";
import { Camera } from "https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js";

let scene, camera, renderer, controls, stereo;
let handMeshes = [];

document.getElementById("start").onclick = async () => {

    // iOS許可
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        const res = await DeviceOrientationEvent.requestPermission();
        if (res !== 'granted') {
            alert("ジャイロ許可が必要");
            return;
        }
    }

    document.getElementById("overlay").style.display = "none";

    init();
    startHands();
};

function init() {

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050505);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.05, 50);

    renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    controls = new DeviceOrientationControls(camera);

    stereo = new THREE.StereoCamera();
    stereo.eyeSep = 0.064;

    scene.add(new THREE.GridHelper(10,10));
    scene.add(new THREE.AmbientLight(0xffffff,0.6));

    // 手ジョイント
    const geo = new THREE.SphereGeometry(0.01, 8, 8);
    for (let i=0;i<21;i++){
        const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color:0x00ffcc}));
        scene.add(m);
        handMeshes.push(m);
    }

    window.addEventListener("resize", onResize);

    animate();
}

function animate(){
    requestAnimationFrame(animate);

    controls.update();
    stereo.update(camera);

    const w = window.innerWidth/2;
    const h = window.innerHeight;

    renderer.setScissorTest(true);

    // 左目
    renderer.setViewport(0,0,w,h);
    renderer.setScissor(0,0,w,h);
    renderer.render(scene, stereo.cameraL);

    // 右目
    renderer.setViewport(w,0,w,h);
    renderer.setScissor(w,0,w,h);
    renderer.render(scene, stereo.cameraR);

    renderer.setScissorTest(false);
}

function onResize(){
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

// =====================
// Hand Tracking
// =====================
function startHands(){

    const video = document.getElementById("video");

    const hands = new Hands({
        locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 0,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.6
    });

    hands.onResults(res => {

        if (!res.multiHandLandmarks?.length) return;

        const dist = 0.4;

        res.multiHandLandmarks[0].forEach((p,i)=>{

            const x = (p.x - 0.5) * 0.3;
            const y = -(p.y - 0.5) * 0.3;
            const z = -dist;

            const vec = new THREE.Vector3(x,y,z);

            // カメラ基準 → ワールドへ
            vec.applyQuaternion(camera.quaternion);
            vec.add(camera.position);

            handMeshes[i].position.copy(vec);
        });
    });

    const cam = new Camera(video,{
        onFrame: async ()=>{
            // 負荷軽減（50%間引き）
            if (Math.random() < 0.5) return;
            await hands.send({image:video});
        },
        width:640,
        height:480,
        facingMode:"environment"
    });

    cam.start();
}
</script>
</body>
</html>
