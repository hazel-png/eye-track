<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>CHRONO-SUBWAY: REALISTIC CONTRAST EDITION</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Helvetica', sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 30px; left: 30px; color: #fff; pointer-events: none; z-index: 100;
            text-shadow: 2px 2px 4px #000;
        }
        .label { font-size: 10px; color: #ffaa00; letter-spacing: 2px; text-transform: uppercase; }
        #loading {
            position: fixed; inset: 0; background: #000; display: flex;
            justify-content: center; align-items: center; color: #444; z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="loading">CALIBRATING PHOTOMETRIC DATA...</div>
    <div id="ui">
        <div class="label">Transit Authority</div>
        <div style="font-size: 24px; font-weight: 900;">TIMES SQ - 42 ST</div>
        <div id="status" style="color: #00ff88; font-family: monospace; margin-top: 5px;">TIME: SYNCHRONIZED</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        /**
         * CHRONO-SUBWAY ARCHITECTURE: CONTRAST OPTIMIZED
         * 真っ白にならないよう、影（AO）と反射のバランスを極限まで調整。
         */

        const CONFIG = {
            stationDepth: 800,
            trackGap: 9.2,
            exposure: 1.4, // 白飛びを抑えたリアルな露出
            pillarColor: 0x223a2f, // タイムズスクエアの深い緑
            tileColor: 0xdfdfdf   // 汚れを含んだ白タイル
        };

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0a0a, 0.015);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = CONFIG.exposure;
        document.body.appendChild(renderer.domElement);

        // --- 高度なテクスチャ生成 (汚れ・反射用) ---
        const createGrungeTileTex = () => {
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 1024, 1024);
            
            // タイルの目地
            ctx.strokeStyle = '#999';
            ctx.lineWidth = 1;
            for(let i=0; i<=1024; i+=32) {
                ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,1024); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(1024,i); ctx.stroke();
            }
            // ランダムな汚れ（Grunge）
            for(let i=0; i<2000; i++) {
                ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.05})`;
                ctx.beginPath();
                ctx.arc(Math.random()*1024, Math.random()*1024, Math.random()*5, 0, Math.PI*2);
                ctx.fill();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        };
        const grungeTile = createGrungeTileTex();

        // --- ジオメトリ構築 ---
        const world = new THREE.Group();
        scene.add(world);

        // ホーム (タイル)
        const platGeo = new THREE.BoxGeometry(12, 1, CONFIG.stationDepth);
        const platMat = new THREE.MeshStandardMaterial({ 
            map: grungeTile, 
            roughness: 0.3, 
            metalness: 0.05,
            color: CONFIG.tileColor 
        });
        grungeTile.repeat.set(12, 500);

        const platL = new THREE.Mesh(platGeo, platMat);
        platL.position.set(-10.5, -0.5, 0);
        world.add(platL);
        const platR = platL.clone();
        platR.position.x = 10.5;
        world.add(platR);

        // 線路 (暗い底)
        const trackGeo = new THREE.PlaneGeometry(CONFIG.trackGap, CONFIG.stationDepth);
        const trackMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 1 });
        const tracks = new THREE.Mesh(trackGeo, trackMat);
        tracks.rotation.x = -Math.PI/2;
        tracks.position.y = -0.95;
        world.add(tracks);

        // 柱と鉄骨構造 (リベット感を出すための配置)
        const pillarGeo = new THREE.BoxGeometry(0.7, 5.5, 0.7);
        const pillarMat = new THREE.MeshStandardMaterial({ color: CONFIG.pillarColor, roughness: 0.6, metalness: 0.2 });
        const beamGeo = new THREE.BoxGeometry(32, 0.4, 0.6);

        for (let z = -400; z < 400; z += 7.5) {
            // 柱
            const pL = new THREE.Mesh(pillarGeo, pillarMat);
            pL.position.set(-4.5, 2.25, z); world.add(pL);
            const pR = pL.clone(); pR.position.x = 4.5; world.add(pR);

            // 天井の梁
            const beam = new THREE.Mesh(beamGeo, new THREE.MeshStandardMaterial({ color: 0x111111 }));
            beam.position.set(0, 5, z); world.add(beam);

            // 蛍光灯（白すぎない光）
            if (z % 15 === 0) {
                const bulb = new THREE.Mesh(
                    new THREE.BoxGeometry(4, 0.1, 0.2),
                    new THREE.MeshBasicMaterial({ color: 0xffffff })
                );
                bulb.position.set(0, 4.9, z);
                world.add(bulb);
                
                const pLight = new THREE.PointLight(0xffffff, 15, 20, 1.5);
                pLight.position.set(0, 4, z);
                scene.add(pLight);
            }

            // 配管 (Bundled Pipes) - 画像の詳細を再現
            for (let i = 0; i < 5; i++) {
                const pipe = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.06, 0.06, 7.5, 8),
                    new THREE.MeshStandardMaterial({ color: 0x222222 })
                );
                pipe.rotation.x = Math.PI/2;
                pipe.position.set(-2 + i*0.2, 4.6, z);
                world.add(pipe);
            }
        }

        // 天井 (汚れと影)
        const ceilGeo = new THREE.PlaneGeometry(32, CONFIG.stationDepth);
        const ceilMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 1 });
        const ceiling = new THREE.Mesh(ceilGeo, ceilMat);
        ceiling.rotation.x = Math.PI/2;
        ceiling.position.y = 5.2;
        world.add(ceiling);

        // --- SUBWAY CARS: STAINLESS STEEL R160 ---
        const createCar = (isRight) => {
            const car = new THREE.Group();
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(3.1, 3.6, 60),
                new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.9, roughness: 0.1 })
            );
            car.add(body);
            
            // Windows
            const winMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            for(let z=-25; z<25; z+=5) {
                const w = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 1.2), winMat);
                w.position.set(isRight ? -1.56 : 1.56, 0.5, z);
                w.rotation.y = isRight ? -Math.PI/2 : Math.PI/2;
                car.add(w);
            }
            return car;
        };

        const trainL = createCar(false); trainL.position.x = -2.2; scene.add(trainL);
        const trainR = createCar(true); trainR.position.x = 2.2; scene.add(trainR);

        // --- ライティング (環境光の抑制) ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.2)); // 全体を白くしないよう抑える
        const hemi = new THREE.HemisphereLight(0xffffff, 0x000000, 0.5);
        scene.add(hemi);

        // --- インタラクション & 時間制御 ---
        let baseTime = 0;
        let chronoOffset = 0;
        let targetOffset = 0;
        let isSeeking = false;
        let seekTimer;

        window.addEventListener('wheel', (e) => {
            isSeeking = true;
            targetOffset -= e.deltaY * 0.5;
            clearTimeout(seekTimer);
            seekTimer = setTimeout(() => isSeeking = false, 1000);
        }, { passive: true });

        const keys = { w:0, a:0, s:0, d:0 };
        window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = 1; });
        window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = 0; });

        document.addEventListener('mousemove', (e) => {
            if(document.pointerLockElement) {
                camera.rotation.y -= e.movementX * 0.0015;
                camera.rotation.x -= e.movementY * 0.0015;
                camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
            }
        });
        renderer.domElement.addEventListener('click', () => renderer.domElement.requestPointerLock());

        // --- アニメーション ---
        camera.rotation.order = 'YXZ';
        camera.position.set(6, 1.7, 10);

        function animate() {
            requestAnimationFrame(animate);
            
            if(!isSeeking) {
                baseTime += 0.4;
                chronoOffset += (0 - chronoOffset) * 0.05;
                document.getElementById('status').innerText = "LIVE FEED: SYNCED";
                document.getElementById('status').style.color = "#00ff88";
            } else {
                chronoOffset += (targetOffset - chronoOffset) * 0.1;
                document.getElementById('status').innerText = "CHRONO SEEKING...";
                document.getElementById('status').style.color = "#ff00ff";
            }

            const t = baseTime + chronoOffset;
            trainL.position.z = (t % 600) - 300;
            trainR.position.z = ((-t * 1.3) % 600) + 300;

            camera.translateZ((keys.s - keys.w) * 0.2);
            camera.translateX((keys.d - keys.a) * 0.2);
            camera.position.y = 1.7;

            renderer.render(scene, camera);
        }

        window.onload = () => {
            document.getElementById('loading').style.display = 'none';
            animate();
        };

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
