<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pseudo VR Step1</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
body { margin:0; overflow:hidden; background:black; }
#btn {
    position: fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:white;
    z-index:10;
}
button { font-size:24px; padding:20px 40px; }
</style>
</head>

<body>

<div id="btn"><button>START</button></div>
<video id="video" playsinline style="display:none;"></video>

<script>
let camera, scene, renderer;
let videoTexture;
let handMeshes = [];

let prevImageData = null;
let velocityZ = 0;

// ======================
// 初期化
// ======================
function init() {
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 10);
    camera.position.z = 1;

    renderer = new THREE.WebGLRenderer({ alpha:true });
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const video = document.getElementById("video");
    videoTexture = new THREE.VideoTexture(video);
    scene.background = videoTexture;

    // 手
    const geo = new THREE.SphereGeometry(0.02, 12, 12);
    const mat = new THREE.MeshBasicMaterial({ color:0x00ffcc });

    for (let i=0;i<21;i++){
        const m = new THREE.Mesh(geo, mat);
        scene.add(m);
        handMeshes.push(m);
    }

    animate();
}

// ======================
// 描画ループ
// ======================
function animate(){
    requestAnimationFrame(animate);

    // 前後移動適用
    camera.position.z += velocityZ;
    velocityZ *= 0.9; // 減衰（重要）

    renderer.render(scene, camera);
}

// ======================
// ジャイロ
// ======================
function setupGyro(){
    window.addEventListener("deviceorientation", (e)=>{
        camera.rotation.order = "YXZ";

        camera.rotation.y = e.alpha * Math.PI/180;
        camera.rotation.x = e.beta * Math.PI/180;
    });
}

// ======================
// カメラ差分（超軽量版）
// ======================
function setupMotionEstimation(video){
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    canvas.width = 160; // 軽量化
    canvas.height = 120;

    setInterval(()=>{
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        const img = ctx.getImageData(0,0,canvas.width,canvas.height);

        if(prevImageData){
            let diff = 0;

            for(let i=0;i<img.data.length;i+=4){
                diff += Math.abs(img.data[i] - prevImageData.data[i]);
            }

            diff /= img.data.length;

            // 前後移動に変換
            velocityZ += diff * 0.00002;

            // 疑似ハプティック
            if(diff > 15 && navigator.vibrate){
                navigator.vibrate(10);
            }
        }

        prevImageData = img;

    }, 50);
}

// ======================
// MediaPipe
// ======================
function setupHands(video){
    const hands = new Hands({
        locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });

    hands.setOptions({
        maxNumHands:1,
        modelComplexity:1,
        minDetectionConfidence:0.7,
        minTrackingConfidence:0.7
    });

    hands.onResults(res=>{
        if(!res.multiHandLandmarks) return;

        const lm = res.multiHandLandmarks[0];

        lm.forEach((p,i)=>{
            const m = handMeshes[i];
            m.position.x = (p.x - 0.5)*2;
            m.position.y = -(p.y - 0.5)*2;
            m.position.z = -p.z * 0.5;
        });
    });

    const cam = new Camera(video,{
        onFrame: async ()=>{
            await hands.send({image:video});
        },
        width:1280,
        height:720
    });

    cam.start();
}

// ======================
// スタート
// ======================
document.querySelector("button").onclick = async ()=>{
    document.getElementById("btn").style.display="none";

    init();
    setupGyro();

    const video = document.getElementById("video");

    setupMotionEstimation(video);
    setupHands(video);
};

// リサイズ
addEventListener("resize", ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
